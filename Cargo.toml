[workspace]
members = ["crates/*", "xtask", "xtask/test_bin"]
resolver = "3"

[workspace.package]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
translate-macros = { version = "0.0.1", path = "crates/translate-macros" }
sha2 = "0.11"
cargo_metadata = "0.23"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_OpenGL",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_System_Kernel",
    "Win32_System_Environment",
] }

[profile.release]
debug = false
lto = "fat"
strip = true
opt-level = "s"
codegen-units = 1

# 默认为`unwind`，可以通过设置环境变量`RUSTFLAGS`为`-C panic=abort`指定为`abort`
# 可以通过指定为 `immediate-abort` 极大减少DLL的体积
# 请看 https://github.com/johnthagen/min-sized-rust
panic = "unwind"
